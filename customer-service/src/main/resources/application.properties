spring.application.name=customer-service
server.port=8081
spring.datasource.url=jdbc:h2:mem:customers-db
spring.h2.console.enabled=true

# desactiver discovery client pour éviter l'erreur de connexion à Eureka
# on a pas creer le discovery server pour l'instant
# eviter la methode register de spring cloud discovery client ip:port
spring.cloud.discovery.enabled=false

# meme chose pour config server, on a pas creer le config server pour l'instant
spring.cloud.config.enabled=false